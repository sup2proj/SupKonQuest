<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SupKonQuest - Manuel de Jeu</title>

        <link rel="icon" type="image/png" href="./assets/favIcon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            body { font-family: 'Cinzel', serif !important; }
            ::-webkit-scrollbar { display: none; }

            @keyframes walkAcrossRight {
                0% { left: -120px; }
                100% { left: calc(100vw + 120px); }
            }

            @keyframes walkAcrossLeft {
                0% { left: calc(100vw + 120px); }
                100% { left: -120px; }
            }

            .animate-walk-right { animation: walkAcrossRight 12s linear forwards; }
            .animate-walk-left { animation: walkAcrossLeft 12s linear forwards; }
        </style>
    </head>
    <body class="bg-[#5c0612] text-white min-h-screen m-0 select-none overflow-hidden [&_*]:cursor-none cursor-none relative">
        <div id="game-cursor" class="fixed top-0 left-0 w-8 h-8 pointer-events-none z-[9999] will-change-transform bg-contain bg-no-repeat bg-center rounded-full transition-all duration-200 ease-out"
             style="background-image: url('./assets/defaultWebCursor.png'); transform: translate3d(-100px, -100px, 0);">
        </div>
        
        <video id="game-unit" muted playsinline loop
               class="fixed h-24 w-auto hidden z-10 object-contain pointer-events-none select-none bg-transparent">
            <source src="./assets/soldat.mp4" type="video/mp4; codecs=hvc1">
            <source src="./assets/soldat.webm" type="video/webm">
        </video>

        <div id="splash-screen" onclick="revealContent()" class="clickable-element fixed inset-0 flex flex-col items-center justify-between py-20 z-50 transition-all duration-1000 ease-in-out bg-black">
            <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover blur-sm brightness-90 contrast-110 -z-10">
                <source src="./assets/BackgroundScreenVideo.mp4" type="video/mp4">
                <source src="./assets/BackgroundScreenVideo.webm" type="video/webm">
            </video>
            <div></div>
            <h1 class="text-4xl md:text-7xl font-bold text-[#D4AF37] tracking-wider drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] text-center px-4">
                SupKonQuest
            </h1>
            <div class="animate-pulse text-stone-300 tracking-widest text-xs md:text-sm drop-shadow-[0_2px_2px_rgba(0,0,0,1)] text-center px-4">
                Cliquez pour continuer
            </div>
        </div>

        <div id="main-content" class="hidden min-h-screen w-full flex items-center justify-center p-4 opacity-0 transition-opacity duration-1000 ease-in overflow-y-hidden overflow-x-hidden z-20 relative">

            <div id="papyrus-parchemin" class="relative w-full max-w-2xl text-stone-900 p-8 md:p-14 flex flex-col justify-between mx-auto my-auto h-auto max-h-[85vh] md:max-h-none overflow-y-auto"
                 style="background-image: url('./assets/papyrus.png'); background-repeat: no-repeat; background-size: 100% 100%; background-position: center; filter: drop-shadow(0px 0px 30px rgba(0, 0, 0, 0.75));">

                <div class="text-center pt-4">
                    <h2 class="text-3xl md:text-5xl font-bold text-[#730816] tracking-wide mb-4">SupKonQuest</h2>
                    <div class="space-y-2 text-base md:text-xl font-bold text-[#54020b] tracking-wide">
                        <p class="md:translate-x-[-2rem]">Déployez vos troupes.</p>
                        <p class="md:translate-x-[2rem]">Lancez la conquête.</p>
                    </div>
                </div>

                <div class="my-2 flex flex-col items-center">
                    <a href="./SupKonQuest-Manuel_de_jeu_FR.pdf" download class="clickable-element group relative bg-[#cc1f26] hover:bg-[#b0171d] text-white p-8 rounded-lg shadow-xl border-2 border-[#54020b] transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center justify-center w-40 h-40 text-center">
                        <div class="absolute -top-2 -left-2 w-4 h-4 border-t-4 border-l-4 border-[#54020b]"></div>
                        <div class="absolute -top-2 -right-2 w-4 h-4 border-t-4 border-r-4 border-[#54020b]"></div>
                        <div class="absolute -bottom-2 -left-2 w-4 h-4 border-b-4 border-l-4 border-[#54020b]"></div>
                        <div class="absolute -bottom-2 -right-2 w-4 h-4 border-b-4 border-r-4 border-[#54020b]"></div>
                        <span class="text-4xl mb-2">📜</span>
                        <span class="font-bold tracking-wider text-sm">Télécharger Le Manuel</span>
                    </a>
                </div>

                <div class="flex flex-col items-center justify-center m-2">
                    <div class="flex justify-center items-center gap-4">
                        <img src="./assets/pegi_12.png" alt="PEGI 12" class="h-14 w-auto">
                        <img src="./assets/pegi_violence.png" alt="Violence" class="h-14 w-auto">
                        <img src="./assets/pegi_in_app.png" alt="Achats intégrés" class="h-14 w-auto">
                    </div>
                    <p class="mt-2 text-[#54020b] font-bold text-xs md:text-base tracking-wide">
                        PEGI 12 | Violence, Achats intégrés
                    </p>
                </div>

                <div class="flex items-end justify-between mt-auto pb-4 px-4">
                    <div class="flex items-center justify-start"><img src="./assets/logo_sled.png" class="h-14 md:h-28 w-auto object-contain select-none pointer-events-none"></div>
                    <div class="flex items-center justify-end"><img src="./assets/coming_soon.png" class="h-14 md:h-32 w-auto object-contain select-none pointer-events-none"></div>
                </div>
            </div>
        </div>

        <script>
            let isTransitioned = false;
            const cursor = document.getElementById('game-cursor');
            const unit = document.getElementById('game-unit');
            const papyrus = document.getElementById('papyrus-parchemin');

            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (isTouch) {
                cursor.style.display = 'none';
            } else {
                document.addEventListener('mousemove', (e) => { cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`; });
                document.querySelectorAll('.clickable-element').forEach(el => {
                    el.addEventListener('mouseenter', () => { cursor.classList.add('scale-125'); cursor.style.boxShadow = '0 0 15px #D4AF37, inset 0 0 10px #cc1f26'; });
                    el.addEventListener('mouseleave', () => { cursor.classList.remove('scale-125'); cursor.style.boxShadow = 'none'; });
                });
                document.addEventListener('mouseleave', () => { cursor.style.display = 'none'; });
                document.addEventListener('mouseenter', () => { cursor.style.display = 'block'; });
            }

            function triggerUnitSpawn() {
                if (!isTransitioned) return;
                const rect = papyrus.getBoundingClientRect();
                unit.style.top = `${Math.random() * (rect.bottom - 96 - rect.top) + rect.top}px`;
                unit.classList.remove('animate-walk-right', 'animate-walk-left', 'hidden');
                unit.currentTime = 0;
                unit.play();
                const walkToLeft = Math.random() < 0.5;
                unit.style.transform = walkToLeft ? 'scaleX(-1)' : 'none';
                void unit.offsetWidth;
                unit.classList.add(walkToLeft ? 'animate-walk-left' : 'animate-walk-right');
            }

            unit.addEventListener('animationend', () => {
                unit.classList.add('hidden');
                setTimeout(triggerUnitSpawn, Math.random() * 3000 + 3000);
            });

            function revealContent() {
                if (isTransitioned) return;
                isTransitioned = true;
                document.getElementById('splash-screen').classList.add('opacity-0', 'scale-105');
                document.getElementById('main-content').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('main-content').classList.add('opacity-100');
                    setTimeout(triggerUnitSpawn, 1000);
                }, 1000);
            }
            document.addEventListener('keydown', revealContent);
        </script>
    </body>
</html>
